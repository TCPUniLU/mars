# MARS solvent library metadata.
#
# Each entry maps a canonical lower-case solvent name (matching its
# corresponding `library/<name>.xyz` file) to:
#   - aliases:    list of alternative names users may pass on the CLI/API.
#   - formula:    molecular formula string.
#   - smiles:     SMILES string used to (re)generate the geometry.
#   - density:    density at 25 °C in g/cm³ (NaN/omitted if not standard).
#   - dielectric: static relative permittivity at 25 °C.
#   - source:     short note about geometry origin. Entries marked
#                 "experimental" are curated geometries and are NOT
#                 regenerated by tools/regen_solvents.py; all others are
#                 built from `smiles` with Open Babel (`obabel --gen3d`).
#
# Densities and dielectrics are CRC Handbook reference values at 298 K
# unless noted otherwise.  Geometries are reasonable starting points only —
# the solvation builder relaxes them when --opt-mode != none.
#
# To regenerate the non-experimental geometries:
#     python tools/regen_solvents.py

[water]
aliases = ["H2O"]
formula = "H2O"
smiles = "O"
density = 0.997
dielectric = 78.4
source = "experimental"

[methanol]
aliases = ["MeOH"]
formula = "CH3OH"
smiles = "CO"
density = 0.791
dielectric = 32.7
source = "experimental"

